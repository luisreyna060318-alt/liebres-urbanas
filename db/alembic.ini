# Configuración de Alembic (migraciones de la base de datos).
# Se ejecuta desde la raíz del repositorio:
#     alembic -c db/alembic.ini upgrade head
# La URL de la base NO va aquí: env.py la toma de DATABASE_URL (app.core.config).

[alembic]
script_location = %(here)s/migrations
# Archivos de migración con nombre "0001_descripcion.py"
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
